<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Echo-Archiv Szene v3</title>
<style>
  @font-face { font-family: Caveat; src: url(../../pipeline/assets/fonts/Caveat.ttf); }
  @font-face { font-family: Cinzel; src: url(../../pipeline/assets/fonts/Cinzel.ttf); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #stage { position: absolute; inset: 0; }
  /* TikTok safe area: text inside x 110..930, y 220..1480 */
  #cap { position: absolute; left: 110px; width: 820px; top: 1250px; text-align: center; font: 700 56px/1.18 Inter, sans-serif;
         color: #fff; -webkit-text-stroke: 9px #0b0d16; paint-order: stroke fill; }
  #cap.off { font-family: Caladea, serif; font-style: italic; font-size: 58px; color: #f4e6c4; }
  #brand, #title { position: absolute; left: 0; right: 0; top: 230px; text-align: center; font: 600 34px Cinzel, serif; letter-spacing: 10px;
           color: #f2c86b; text-shadow: 0 0 18px #000; }
  #title { top: 320px; font-size: 44px; color: #efe6cf; text-transform: uppercase; }
  #title.hook { font-size: 64px; font-weight: 700; letter-spacing: 6px; color: #f6efdc; padding: 0 110px; line-height: 1.15; }  /* wraps inside the safe area */
</style></head>
<body><svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg><div id="brand"></div><div id="title"></div><div id="cap"></div>
<script>
// Generic v3 renderer: every shot = generated plate(s) + camera move + named overlay effects. Data comes from timeline.json.
const W = 1080, H = 1920, PW = 1188, PH = 2112;   // plates carry 10 % headroom for camera moves
const KW = 720;                                     // keyframe width: fx_at positions are measured in kf/<id>.png pixels
let TL, GRAIN;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, t) => a + (b - a) * t;
const seq = (u, a, b) => ease((u - a) / (b - a));
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const pair = (v, p, d) => Array.isArray(v) ? lerp(v[0], v[1], p) : (v ?? d);
const at = (sh, name, def = [360, 640, 1]) => (sh.fx_at || {})[name] || def;   // [x, y, scale, x-squash, degrees] in keyframe pixels (episode.json)
// plate-anchored effect: drawn around (0,0) in keyframe pixels, moves with the camera like the plate itself; x-squash < 1 = surface seen at an angle
const anchor = (X, [x, y, k, sx = 1, rot = 0], body) => `<g transform="${X} scale(${PW / KW}) translate(${x},${y}) rotate(${rot}) scale(${k * sx},${k})">${body}</g>`;

function speaking(who, t) {   // audio envelope of the active line of `who` (0..1)
  for (const l of TL.lines) if (l.who === who && t >= l.start && t <= l.end + 0.05) {
    const v = l.env[Math.min(l.env.length - 1, Math.floor((t - l.start) * TL.fps))] || 0;
    return v < 0.2 ? 0 : 1;
  }
  return 0;
}

function xform(m, p, t) {      // camera move of the plate (shared with plate-anchored effects)
  const z = pair(m.zoom, p, 1), x = pair(m.x, p, 0), y = pair(m.y, p, 0);
  const sh = m.shake ? Math.sin(t * 37) * m.shake : 0, sv = m.shake ? Math.cos(t * 29) * m.shake : 0;
  const s = z * W / PW;       // plate width fills the frame at zoom 1
  return `translate(${W / 2 + x + sh - PW * s / 2},${H / 2 + y + sv - PH * s / 2}) scale(${s})`;
}

function plate(href, X, op = 1) {
  return `<image href="${href}" x="0" y="0" width="${PW}" height="${PH}" opacity="${op}" transform="${X}" preserveAspectRatio="none"/>`;
}

function occluder(sh, X) {   // garbage matte in keyframe px: plate-anchored effects stay behind foreground objects (a finger over the seal)
  const poly = (sh.fx_at || {}).occlude;
  return poly ? `<defs><mask id="oc" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="#fff"/>
    <polygon transform="${X} scale(${PW / KW})" points="${poly.map((q) => q.join(",")).join(" ")}" fill="#000"/></mask></defs>` : "";
}

function notches(u, t, last) {   // the seal's eight rule marks around (0,0), radius 100: seven gold, the eighth dark (S01) or alarm red (S02)
  let s = `<defs><filter id="ng" x="-2" y="-2" width="5" height="5"><feGaussianBlur stdDeviation="5"/><feMerge><feMergeNode/><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="nh"><stop offset="0" stop-color="#ffcf66" stop-opacity="0.55"/><stop offset="1" stop-color="#ffcf66" stop-opacity="0"/></radialGradient>
    <radialGradient id="nr"><stop offset="0" stop-color="#ff3b1f" stop-opacity="0.9"/><stop offset="1" stop-color="#ff3b1f" stop-opacity="0"/></radialGradient></defs>`;
  for (let i = 0; i < 8; i++) {
    const eighth = i === 7, wave = 0.5 + 0.5 * Math.sin(t * 2.4 - i * 0.8);   // light runs around the seven
    const g = `<g transform="rotate(${-90 + i * 45}) translate(80,0) rotate(90)">`;   // slots run along the rim
    if (!eighth) s += `${g}<circle r="22" fill="url(#nh)" opacity="${0.5 + 0.5 * wave}" style="mix-blend-mode:screen"/>
      <rect x="-14" y="-5.5" width="28" height="11" rx="4" fill="#1a1006" opacity="0.7"/>
      <rect x="-12.5" y="-4.2" width="25" height="8.4" rx="4" fill="#ffd36b" opacity="${0.8 + 0.2 * wave}" filter="url(#ng)"/></g>`;
    else if (last === "red") { const pulse = 0.65 + 0.35 * Math.sin(t * Math.PI * 4);
      s += `${g}<circle r="${90 + 20 * pulse}" fill="url(#nr)" opacity="${0.35 * pulse}" style="mix-blend-mode:screen"/>
      <circle r="${42 + 10 * pulse}" fill="url(#nr)" opacity="${pulse}" style="mix-blend-mode:screen"/>
      <rect x="-14" y="-5.5" width="28" height="11" rx="4" fill="#1a0604" opacity="0.8"/>
      <rect x="-12.5" y="-4.2" width="25" height="8.4" rx="4" fill="#ff4a24" opacity="${0.75 + 0.25 * pulse}" filter="url(#ng)"/></g>`; }
    else { const ember = 0.6 * Math.max(0, Math.sin((u - 0.95) * Math.PI / 0.5)) * (u > 0.95 && u < 1.45);   // flickers at "Regel acht"
      s += `${g}<rect x="-14.5" y="-6" width="29" height="12" rx="4" fill="#050302" opacity="0.95" stroke="#9b7440" stroke-width="1.4"/>
      <rect x="-11" y="-3" width="22" height="6" rx="3" fill="#ff5a2a" opacity="${ember}" filter="url(#ng)"/></g>`; }
  }
  return s;
}

function motes(t, seed, n, col = "#f2c86b", op = 0.55) {
  const r = rng(seed); let s = "";
  for (let i = 0; i < n; i++) {
    const x0 = r() * W, sp = 10 + r() * 30, ph = r() * 6.28, sz = 1.5 + r() * 3.5;
    const y = (((r() * H) - t * sp) % H + H) % H, x = x0 + Math.sin(t * 0.7 + ph) * 22;
    s += `<circle cx="${x}" cy="${y}" r="${sz}" fill="${col}" opacity="${op * (0.35 + 0.65 * Math.abs(Math.sin(t * 1.3 + ph)))}"/>`;
  }
  return s;
}

const FX = {   // (u, d, t, shot, X): u = time in shot, d = shot length, X = camera transform for plate-anchored effects
  motes: (u, d, t) => motes(t, 3, 55),
  alarm: (u, d, t) => `<rect width="${W}" height="${H}" fill="#ff6a50" opacity="0.5" style="mix-blend-mode:multiply"/>
      <rect width="${W}" height="${H}" fill="#ff3b1f" opacity="${0.06 + 0.12 * (0.5 + 0.5 * Math.sin(t * Math.PI * 4))}" style="mix-blend-mode:screen"/>`,
  notches: (u, d, t, sh, X) => anchor(X, at(sh, "notches"), notches(u, t, "dark")),
  notches_red: (u, d, t, sh, X) => anchor(X, at(sh, "notches"), notches(u, t, "red")),
  rays: (u, d, t) => {
    let s = ""; const o = seq(u, d * 0.3, d * 0.8);
    for (let i = -4; i <= 4; i++) s += `<path d="M540,760 L${540 + i * 260 - 90},${H} L${540 + i * 260 + 90},${H} Z" fill="#fff2cc" opacity="${0.06 * o}" style="mix-blend-mode:screen"/>`;
    return s + `<rect width="${W}" height="${H}" fill="#fff6dc" opacity="${0.5 * seq(u, d * 0.42, d * 0.58) * (1 - seq(u, d * 0.6, d * 0.85))}"/>`;
  },
  pin: (u, d, t, sh, X) => anchor(X, at(sh, "pin"),   // Nox' broken-circle pin (canon), same shape as the signature in S17; radius 10
    `<defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1b8"/><stop offset="0.45" stop-color="#e0a93a"/><stop offset="1" stop-color="#7a4f12"/></linearGradient></defs>
      <circle r="10" fill="none" stroke="#2a1704" stroke-opacity="0.7" stroke-width="5.6" stroke-dasharray="${2 * Math.PI * 10 * 0.78} 99" transform="translate(0.8,1.2) rotate(-40)"/>
      <circle r="10" fill="none" stroke="url(#pg)" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="${2 * Math.PI * 10 * 0.78} 99" transform="rotate(-40)"/>
      <circle cx="-5" cy="-7" r="1.3" fill="#fff" opacity="${0.6 + 0.4 * Math.sin(t * 2)}"/>`),
  texts: (u, d, t, sh, X) => (sh.fx_txt || []).map((g) => {   // text on paper/brass: handwriting writes on, stamps punch in
    const lines = g.text.split("\n"), size = g.size || 60, t0 = g.t0 || 0, dur = g.dur || 1.0, w = clamp((u - t0) / dur);
    const font = g.font || "Caveat", weight = g.weight || 700, anchorTo = g.align || "middle";
    const body = lines.map((l, i) => `<text y="${(i - (lines.length - 1) / 2) * size * 1.15 + size * 0.35}" text-anchor="${anchorTo}" font-family="${font}" font-weight="${weight}" font-size="${size}" letter-spacing="${g.spacing || 0}" fill="${g.color || "#1f1d27"}">${l}</text>`).join("");
    const half = (g.width || 400) / 2, hh = lines.length * size * 0.65 + 10;
    if (g.anim === "stamp") {   // punches in at t0: scale 1.5 -> 1, then stays (ink: multiply)
      const k = 1 + 0.5 * (1 - seq(u, t0, t0 + 0.12)), o = u < t0 ? 0 : 0.9;
      return anchor(X, g.at, `<g transform="scale(${k})" opacity="${o}" style="mix-blend-mode:multiply"><rect x="${-half}" y="${-hh}" width="${2 * half}" height="${2 * hh}" rx="6" fill="none" stroke="${g.color}" stroke-width="${size * 0.09}"/>${body}</g>`);
    }
    const id = `tw${g.at[0]}_${g.at[1]}`;
    const clip = g.anim === "write" ? `<clipPath id="${id}"><rect x="${-half}" y="${-hh}" width="${2 * half * w}" height="${2 * hh}"/></clipPath>` : "";
    return anchor(X, g.at, `${clip}<g ${clip ? `clip-path="url(#${id})"` : ""} opacity="${g.opacity || 0.92}" style="mix-blend-mode:multiply">${body}</g>`);
  }).join(""),
  photo: (u, d, t, sh, X) => anchor(X, at(sh, "photo"),   // picture on a held portrait photograph, generated separately for identity control; 156 x 200
    `<defs><filter id="sep"><feColorMatrix type="matrix" values="0.80 0.25 0.05 0 0.02 0.12 0.82 0.05 0 0.01 0.10 0.18 0.62 0 0 0 0 0 1 0"/></filter></defs>
      <image href="${sh.fx_img.photo}" x="-78" y="-100" width="156" height="200" preserveAspectRatio="xMidYMid slice" filter="url(#sep)" style="mix-blend-mode:multiply"/>`),
  echo_pulse: (u, d, t, sh, X) => {   // rings around the watch while Lina speaks (radius 0 = watch centre)
    let s = ""; const v = speaking("lina", t);
    for (let k = 0; k < 3; k++) { const r = 70 + ((t * 85 + k * 85) % 255);
      s += `<circle r="${r}" fill="none" stroke="#f2c86b" stroke-width="2" opacity="${0.45 * v * (1 - (r - 70) / 255)}"/>`; }
    return anchor(X, at(sh, "echo_pulse"), s);
  },
  engraving: (u, d, t, sh, X) => anchor(X, at(sh, "engraving"), ["N. VEYR", "·", "LINA"].map((w, i) =>   // lid centre, ~3 lines of 72 px
      `<text x="1.2" y="${(i - 1) * 79 + 26}" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="72" fill="#fff3c4" opacity="0.45">${w}</text>
       <text y="${(i - 1) * 79 + 24}" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="72" fill="#4b3410" opacity="0.88" style="mix-blend-mode:multiply">${w}</text>`).join("")),
  glint: (u, d, t, sh, X) => anchor(X, at(sh, "glint", at(sh, "engraving")),   // soft light sweep across the lid only (radius 200)
    `<defs><clipPath id="gc"><circle r="200"/></clipPath><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
      <g clip-path="url(#gc)"><rect x="${lerp(-360, 200, seq(u, d * 0.25, d * 0.75))}" y="-400" width="160" height="800" fill="url(#gl)" transform="rotate(20)" style="mix-blend-mode:screen"/></g>`),
  flash: (u, d, t) => `<rect width="${W}" height="${H}" fill="#fff" opacity="${seq(u, d * 0.35, d * 0.7)}"/>`,
  snow: (u, d, t) => { const r = rng(21); let s = "";
    for (let i = 0; i < 140; i++) { const x0 = r() * W, sp = 70 + r() * 130, ph = r() * H, z = 0.4 + r();
      s += `<circle cx="${x0 + Math.sin(t * 0.8 + i) * 24}" cy="${((ph + t * sp * z) % (H + 40)) - 20}" r="${2.2 * z + 1}" fill="#fff" opacity="${0.5 + 0.35 * z / 1.4}"/>`; }
    return s; },
  dream: (u, d, t) => `<defs><radialGradient id="dr" cx="0.5" cy="0.5" r="0.75"><stop offset="0.55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0.85"/></radialGradient></defs>
      <rect width="${W}" height="${H}" fill="url(#dr)"/><rect width="${W}" height="${H}" fill="#fff" opacity="${1 - seq(u, 0, 0.7)}"/>`,
  memory_flow: (u, d, t, sh, X) => { const r = rng(77); let s = ""; const f = seq(u, 0.1, d);   // light leaves Nox' head (0,0) up and away
    for (let i = 0; i < 50; i++) { const k = ((u * 0.5 + r()) % 1);
      const x = lerp((r() - 0.5) * 100, 240, k) + Math.sin(k * 9 + i) * 30 * (1 - k), y = lerp((r() - 0.5) * 90, -250, k) - Math.sin(k * 3.14) * 80;
      s += `<circle cx="${x}" cy="${y}" r="${1.6 + 2.6 * (1 - k)}" fill="#ffd77a" opacity="${0.85 * (1 - k) * f}" style="mix-blend-mode:screen"/>`; }
    return anchor(X, at(sh, "memory_flow"), s); },
  handwriting: (u, d, t, sh, X) => { const w = clamp((u - 1.3) / 1.1), sig = clamp((u - 2.6) / 0.6), c = 2 * Math.PI * 29; // writes after Nox' question
    return anchor(X, at(sh, "handwriting"), `<clipPath id="wr"><rect x="-260" y="-140" width="${520 * w}" height="215"/></clipPath>
      <text y="45" text-anchor="middle" font-family="Caveat" font-weight="700" font-size="133" fill="#1f1d27" opacity="0.92" clip-path="url(#wr)" style="mix-blend-mode:multiply">Lina lebt.</text>
      ${sig > 0 ? `<circle cx="167" cy="165" r="29" fill="none" stroke="#1f1d27" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c * 0.78 * sig} ${c}" transform="rotate(-40 167 165)" opacity="0.9"/>` : ""}`)
      + `<rect width="${W}" height="${H}" fill="#000" opacity="${seq(u, d - 0.45, d)}"/>`; },
  endcard: (u, d, t) => { let s = `<rect width="${W}" height="${H}" fill="#000" opacity="0.55"/>`;
    for (let k = 0; k < 4; k++) { const e = u - (0.95 + k * 0.38);
      if (e > 0) s += `<circle cx="540" cy="860" r="${60 + e * 520}" fill="none" stroke="#f2c86b" stroke-width="${5 - k}" opacity="${Math.max(0, 0.8 - e * 0.55) * (1 - k * 0.2)}"/>`; }
    const o = seq(u, 0.9, 1.6);
    return s + `<g opacity="${o}"><text x="540" y="880" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="88" letter-spacing="6" fill="#f2c86b">DAS ECHO-ARCHIV</text>
      <text x="540" y="960" text-anchor="middle" font-family="Inter" font-weight="600" font-size="38" letter-spacing="8" fill="#e6dcc2">FOLGE ${TL.ep.num} · ${TL.ep.title.toUpperCase()}</text>
      <text x="540" y="1420" text-anchor="middle" font-family="Inter" font-size="34" fill="#a9adb9">KI-generierte fiktionale Serie</text></g>`; },
};

const ANCHORED = new Set(["notches", "notches_red", "pin", "photo", "texts", "echo_pulse", "engraving", "glint", "memory_flow", "handwriting"]);

window.initScene = (tl) => {
  TL = tl;
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const x = c.getContext("2d"), img = x.createImageData(256, 256), r = rng(99);
  for (let i = 0; i < img.data.length; i += 4) { const v = 110 + r() * 145; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  x.putImageData(img, 0, 0); GRAIN = c.toDataURL();
};

window.renderAt = (t) => {
  const shot = TL.shots.find((s) => t >= s.start && t < s.end) || TL.shots[TL.shots.length - 1];
  const u = t - shot.start, d = shot.end - shot.start, p = u / d, m = shot.motion || {};
  let s = "";
  const X = xform(m, p, t);
  if (m.from) s += plate(m.from, X, 1);                       // previous state underneath, new state fades in
  s += plate(shot.plate, X, m.from ? seq(u, 0, Math.min(0.5, d * 0.3)) : 1);
  if (m.to) s += plate(m.to, X, seq(u, d * 0.42, d * 0.78));  // in-shot transformation (door opens, eyes go blank)
  for (const [who, patch] of Object.entries(shot.talk || {})) // mouth flap: variant patch while the voice is active
    if (speaking(who, t)) s += plate(patch, X, 1);
  let fx = "", onPlate = "";   // the matte hides only plate-anchored effects, never screen-wide grades like the alarm
  for (const f of shot.fx || []) if (ANCHORED.has(f)) onPlate += FX[f](u, d, t, shot, X); else fx += FX[f](u, d, t, shot, X);
  const oc = occluder(shot, X);
  s += (oc ? `${oc}<g mask="url(#oc)">${onPlate}</g>` : onPlate) + fx;
  const r = rng(Math.floor(t * 30) + 5);
  s += `<defs><radialGradient id="vg" cx="0.5" cy="0.48" r="0.78"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.5"/></radialGradient>
    <pattern id="gp" width="256" height="256" patternUnits="userSpaceOnUse" x="${Math.floor(r() * 256)}" y="${Math.floor(r() * 256)}"><image href="${GRAIN}" width="256" height="256"/></pattern></defs>
    <rect width="${W}" height="${H}" fill="url(#vg)"/><rect width="${W}" height="${H}" fill="url(#gp)" opacity="0.06" style="mix-blend-mode:overlay"/>`;
  document.getElementById("stage").innerHTML = s;
  const line = TL.lines.find((l) => t >= l.start - 0.05 && t <= l.end + 0.35);
  const cap = document.getElementById("cap");
  cap.textContent = line ? line.text : "";
  const ls = line && TL.shots.find((x) => x.id === line.shot);
  cap.className = line && !(ls.talk || {})[line.who] ? "off" : "";
  cap.style.top = `${(ls && ls.cap_y) || 1250}px`;   // a shot can move the caption off a key image (S16: below the photo)
  const ti = document.getElementById("title"), showTitle = shot.text && !(shot.fx || []).includes("handwriting");  // e.g. time jumps
  ti.textContent = showTitle ? shot.text : "";
  ti.classList.toggle("hook", shot === TL.shots[0]);  // on-screen hook text: larger than a time-jump label
  ti.style.opacity = showTitle ? Math.min(seq(u, 0.1, 0.5), 1 - seq(u, 2.0, 2.5)) : 0;
  const b = document.getElementById("brand");
  b.textContent = t < 2.6 ? `DAS ECHO-ARCHIV · ${String(TL.ep.num).padStart(2, "0")}` : "";
  b.style.opacity = t < 2.6 ? Math.min(1, t * 2, (2.6 - t) * 3) * 0.85 : 0;
};
</script></body></html>
