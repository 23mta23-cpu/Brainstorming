<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>E001 Regel Acht</title>
<style>
  @font-face { font-family: Caveat; src: url(../../../../pipeline/assets/fonts/Caveat.ttf); }
  @font-face { font-family: Cinzel; src: url(../../../../pipeline/assets/fonts/Cinzel.ttf); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #stage { position: absolute; inset: 0; }
  /* TikTok safe area: keep text inside x 90..930, y 220..1480 (right icon rail + bottom caption zone stay free) */
  #cap { position: absolute; left: 110px; width: 820px; top: 1250px; text-align: center; font: 700 56px/1.18 Inter, sans-serif;
         color: #fff; -webkit-text-stroke: 9px #0b0d16; paint-order: stroke fill; letter-spacing: 0.3px; }
  #cap.off { font-family: Caladea, serif; font-style: italic; font-weight: 700; font-size: 58px; color: #f4e6c4; }
  #brand { position: absolute; left: 0; right: 0; top: 230px; text-align: center; font: 600 34px Cinzel, serif; letter-spacing: 10px; color: #f2c86b; }
</style></head>
<body><svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg><div id="brand"></div><div id="cap"></div>
<script src="../../characters/characters.js"></script>
<script src="../../world.js"></script>
<script>
let TL, GRAIN;
const OFFSCREEN = { S01: ["erzaehler"], S02: ["erzaehler"], S05: ["lina"], S07: ["mira"], S11: ["nox"] };

function speak(who, t) { // mouth openness from the line's real audio envelope
  for (const l of TL.lines) if (l.who === who && t >= l.start && t <= l.end + 0.05) {
    const v = l.env[Math.min(l.env.length - 1, Math.floor((t - l.start) * TL.fps))] || 0;
    return v < 0.18 ? 0 : v;
  }
  return 0;
}
const blinkAt = (t, seed) => { const p = (t + seed) % 3.7; return p < 0.12 ? Math.sin(p / 0.12 * Math.PI) : 0; };

const SHOTS = {
  S01(u, d, t) { // ECU hand toward the seal
    const reach = seq(u, 0, d * 0.85), ring = seq(u, d * 0.6, d);
    const hx = lerp(-160, 330, reach), hy = lerp(1500, 1180, reach);
    let s = `<rect width="${W}" height="${H}" fill="#1b130b"/>` + seal({ x: 540, y: 860, s: 1.45, glow: 0.3 + 0.2 * Math.sin(t * 3) });
    s += lightCone(540, -40, 1300, 1400, "#f6e3b0", 0.12);
    s += noxHand({ x: hx, y: hy, s: 1.5, rot: -22 });
    if (ring > 0) for (let i = 0; i < 18; i++) {
      const a = i / 18 * 6.283 + t * 2, wx = hx - 40, wy = hy;
      s += `<circle cx="${wx + Math.cos(a) * 95}" cy="${wy + Math.sin(a) * 60}" r="5" fill="#f2c86b" opacity="${ring * 0.85}"/>`;
    }
    return camera(s + motes(t, 3, 40, [0, 0, W, H], "#f2c86b", 2.5, 0.35), 1 + 0.06 * u / d);
  },
  S02(u, d, t) { // alarm; 8th notch glows; Pip points at the door
    const pulse = 0.5 + 0.5 * Math.sin(t * 2 * Math.PI * 2);
    let s = archiveBg({ t, camX: -u * 30 }) + door({ x: 560, y: 760, s: 0.62, glow: 0.4, eighth: 0.4 + 0.6 * pulse });
    const needle = u < d * 0.55 ? u * 1400 : 72;
    s += `<rect x="70" y="1090" width="330" height="18" fill="#2a3456"/>` + pip({ x: 230, y: 1030, s: 1.25, needle, blink: blinkAt(t, 1) > 0.5 });
    s += noxBack({ x: 820, y: 1500, s: 1.55 });
    s += `<rect width="${W}" height="${H}" fill="#ff4a2a" opacity="${0.08 + 0.16 * pulse}"/>`;
    const sh = Math.sin(t * 37) * 4;
    return camera(s, 1.02, W / 2, H / 2, sh, Math.cos(t * 29) * 3);
  },
  S03(u, d, t) { // Mira grabs Nox' sleeve
    const grab = seq(u, 0, 0.35);
    let s = archiveBg({ t, camX: 120, dim: 0.6 }) + `<rect width="${W}" height="${H}" fill="#05070f" opacity="0.35"/>`;
    s += nox({ x: 720, y: 980, s: 1.35, look: [-0.7, 0.1], brow: 0.3, blink: blinkAt(t, 0.4), tilt: -4 });
    s += mira({ x: 330, y: 1010, s: 1.3, look: [0.6, 0], brow: 0.6, mouth: speak("mira", t), tilt: 5 });
    s += miraHand({ x: lerp(380, 520, grab), y: 1420, s: 1.2, rot: -8 });
    return camera(s, 1.0);
  },
  S04(u, d, t) { // the door opens by itself
    const rot = seq(u, 0, d * 0.4) * 160, op = seq(u, d * 0.35, d);
    let s = archiveBg({ t, camX: 0, dim: 0.8 }) + door({ x: 540, y: 820, s: 1.05, sealRot: rot, open: op, glow: 0.6, eighth: 0.6 });
    if (op > 0) for (let i = -3; i <= 3; i++)
      s += `<path d="M540,800 L${540 + i * 240 - 120},${H} L${540 + i * 240 + 120},${H} Z" fill="#f6e3b0" opacity="${0.07 * op}"/>`;
    s += noxBack({ x: 540, y: 1640, s: 1.2 }) + motes(t, 9, 50, [200, 400, 680, 1300], "#f6e3b0", 3, 0.5 * op);
    return camera(s, 1 + 0.08 * u / d);
  },
  S05(u, d, t) { // dark room, floating watch, echo voice
    const v = speak("lina", t), bob = Math.sin(t * 1.6) * 14;
    let s = `<rect width="${W}" height="${H}" fill="#04050a"/>` + lightCone(540, -60, 820, 1500, "#f6e3b0", 0.22);
    for (let k = 0; k < 3; k++) {
      const r = 180 + ((t * 120 + k * 120) % 360);
      s += `<circle cx="540" cy="${880 + bob}" r="${r}" fill="none" stroke="#f2c86b" stroke-width="3" opacity="${0.5 * v * (1 - (r - 180) / 360)}"/>`;
    }
    s += watch({ x: 540, y: 880 + bob, s: 1.25, rot: Math.sin(t * 0.7) * 6, sec: Math.floor(u / 0.5) * 6, glow: 0.5 + 0.5 * v });
    s += motes(t, 5, 70, [300, 0, 480, 1500], "#f6e3b0", 2.5, 0.5);
    return camera(s, 1.02 + 0.04 * u / d, W / 2, H / 2, Math.sin(u * 0.8) * 20, 0, Math.sin(u * 0.5) * 1.2);
  },
  S06(u, d, t) { // Nox close-up: "Wer bist du?"
    const look = [Math.sin(u * 3) * 0.6, -0.15];
    let s = `<rect width="${W}" height="${H}" fill="#070910"/>` + `<circle cx="1000" cy="700" r="520" fill="#f2c86b" opacity="0.10"/>`;
    s += nox({ x: 540, y: 820, s: 2.7, look, brow: 0.8, mouth: speak("nox", t), blink: blinkAt(t, 2.1), tilt: 3 });
    s += `<rect x="540" width="540" height="${H}" fill="#f2c86b" opacity="0.06"/>`;
    return camera(s, 1.0);
  },
  S07(u, d, t) { // macro on the engraving
    const g = uid("lid"), gl = uid("glint"), sweep = lerp(-500, 1500, u / d);
    let s = `<defs>${rgrad(g, [[0, "#f7dc96"], [0.65, "#cf9e43"], [1, "#6d4e19"]], 0.4, 0.35, 0.75)}
      <linearGradient id="${gl}" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
      <rect width="${W}" height="${H}" fill="#0a0806"/>
      <circle cx="540" cy="930" r="600" fill="url(#${g})"/>
      <circle cx="540" cy="930" r="560" fill="none" stroke="#7a5a22" stroke-width="10"/>
      <circle cx="540" cy="930" r="520" fill="none" stroke="#f9e6b0" stroke-width="3" opacity="0.5"/>
      ${["N. VEYR", "·", "LINA"].map((w, i) => `<text x="542" y="${842 + i * 112}" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="104" fill="#fbe9b8" opacity="0.55">${w}</text>
        <text x="540" y="${838 + i * 112}" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="104" fill="#5a3f12">${w}</text>`).join("")}
      <rect x="${sweep}" y="300" width="380" height="1300" fill="url(#${gl})" transform="rotate(18 540 930)"/>`;
    return camera(s, 1.05, W / 2, H / 2, lerp(40, -40, u / d));
  },
  S08(u, d, t) { // the touch
    const reach = seq(u, 0, d * 0.45), hit = clamp((u - d * 0.45) / (d * 0.55));
    let s = `<rect width="${W}" height="${H}" fill="#04050a"/>` + watch({ x: 650, y: 780, s: 2.2, rot: -8, sec: 0, glow: 0.8 });
    s += noxHand({ x: lerp(-200, 120, reach), y: lerp(1400, 1150, reach), s: 1.9, rot: -30 });
    const hx = lerp(-200, 120, reach), hy = lerp(1400, 1150, reach), a = -30 * Math.PI / 180;
    const fx = hx + 1.9 * (215 * Math.cos(a) + 6 * Math.sin(a)), fy = hy + 1.9 * (215 * Math.sin(a) - 6 * Math.cos(a));
    if (hit > 0) s += `<circle cx="${fx}" cy="${fy}" r="${hit * 1600}" fill="#fff" opacity="${0.4 + 0.6 * hit}"/>`;
    return camera(s, 1 + 0.05 * u / d);
  },
  S09(u, d, t) { // vision: snowy station, the path not taken
    const g = uid("sky"), fromWhite = 1 - seq(u, 0, 0.6);
    let s = `<defs>${grad(g, [[0, "#eef3f8"], [0.6, "#c2d0dd"], [1, "#9fb1c2"]])}</defs><rect width="${W}" height="${H}" fill="url(#${g})"/>
      <rect x="-40" y="980" width="1160" height="300" rx="40" fill="#5d6b7a"/>
      ${Array.from({ length: 7 }, (_, i) => `<rect x="${i * 170 - 10}" y="1030" width="110" height="90" rx="12" fill="#ffe7a8" opacity="0.85"/>`).join("")}
      <rect x="0" y="1280" width="${W}" height="${H}" fill="#dfe6ec"/><rect x="0" y="1280" width="${W}" height="14" fill="#8796a5"/>
      <rect x="140" y="560" width="16" height="740" fill="#56606c"/><circle cx="148" cy="560" r="34" fill="#fff6d8" opacity="0.9"/>
      <circle cx="148" cy="560" r="110" fill="#fff6d8" opacity="0.25"/>`;
    s += linaFull({ x: 540, y: 760, s: 1.35, look: [0, -0.4], mouth: speak("lina", t), brow: 0.4, blink: blinkAt(t, 0.9) });
    s += snow(t, 21, 130) + vignette(0.9, "#ffffff");
    s += `<rect width="${W}" height="${H}" fill="#fff" opacity="${fromWhite}"/>`;
    return camera(s, 1 + 0.06 * u / d);
  },
  S10(u, d, t) { // the price: memories leave Nox
    const flow = seq(u, 0.1, d), blank = seq(u, 0.4, d * 0.9);
    const beat = [0.1, 1.134, 2.168].reduce((m, b) => Math.max(m, Math.exp(-Math.abs(u - b) * 9)), 0);
    let s = `<rect width="${W}" height="${H}" fill="#05060c"/>` + watch({ x: 830, y: 470, s: 0.9, glow: 0.6 + 0.4 * flow });
    s += nox({ x: 470, y: 1080, s: 1.7, look: [0.2, -0.1], brow: 0.5 - blank, blank, blink: 0 });
    const r = rng(77);
    for (let i = 0; i < 60; i++) {
      const ph = r(), k = ((u * 0.55 + ph) % 1) * (0.3 + 0.7 * flow);
      const x0 = 470 + (r() - 0.5) * 140, y0 = 900 + (r() - 0.5) * 120;
      const x = lerp(x0, 830, k) + Math.sin(k * 9 + i) * 60 * (1 - k), y = lerp(y0, 470, k) - Math.sin(k * 3.14) * 160;
      s += `<circle cx="${x}" cy="${y}" r="${3 + 5 * (1 - k)}" fill="#f2c86b" opacity="${0.9 * (1 - k) * flow}"/>`;
    }
    s += vignette(0.75 + 0.2 * beat);
    return camera(s, 1 + 0.05 * u / d + 0.008 * beat);
  },
  S11(u, d, t) { // Mira's tear
    let s = `<rect width="${W}" height="${H}" fill="#070910"/><circle cx="160" cy="700" r="520" fill="#62d6c7" opacity="0.07"/>`;
    s += mira({ x: 540, y: 830, s: 2.7, look: [0.1, 0.05], brow: 1, wet: 1, tear: seq(u, 0.2, d * 0.9), blink: 0, tilt: -2 });
    return camera(s, 1 + 0.03 * u / d);
  },
  S12(u, d, t) { // the photo
    const lift = seq(u, 0, 0.5);
    let s = archiveBg({ t, camX: 200, dim: 0.5 }) + `<rect width="${W}" height="${H}" fill="#05070f" opacity="0.45"/>`;
    s += mira({ x: 330, y: 880, s: 1.35, look: [0.5, -0.1], brow: 1, wet: 1, tear: 1, mouth: speak("mira", t), tilt: 4 });
    const py = lerp(1200, 560, lift);
    s += `<g transform="translate(720,${py}) rotate(-6)"><rect x="-210" y="-250" width="420" height="500" fill="#efe6d2"/>
      <rect x="-180" y="-220" width="360" height="380" fill="#d9c7a4"/>
      <clipPath id="ph"><rect x="-180" y="-220" width="360" height="380"/></clipPath><g clip-path="url(#ph)">
        <rect x="-180" y="40" width="360" height="200" fill="#c9b691"/>
        ${nox({ x: -70, y: -20, s: 0.42, smile: 0.8, look: [0.3, 0] })}
        ${linaFull({ x: 75, y: -15, s: 0.46, smile: 1, look: [-0.3, 0] })}
        <rect x="-180" y="-220" width="360" height="380" fill="#c8a76a" opacity="0.28"/></g></g>`;
    s += miraHand({ x: 560, y: py + 230, s: 0.9, rot: -70 });
    return camera(s, 1.0);
  },
  S13(u, d, t) { // the back of the photo
    const flip = seq(u, 0, 0.3), write = clamp((u - 0.35) / 1.0), sig = clamp((u - 1.4) / 0.6), out = seq(u, d - 0.45, d);
    let s = `<rect width="${W}" height="${H}" fill="#06070c"/>
      <g transform="translate(540,900) scale(${Math.max(0.02, flip)},1) rotate(-3)">
        <rect x="-380" y="-460" width="760" height="920" fill="#efe6d2"/><rect x="-380" y="-460" width="760" height="920" fill="url(#grainP)" opacity="0.5"/>
        <clipPath id="wr"><rect x="-340" y="-200" width="${680 * write}" height="300"/></clipPath>
        <text x="0" y="20" text-anchor="middle" font-family="Caveat" font-weight="700" font-size="190" fill="#24222e" clip-path="url(#wr)">Lina lebt.</text>
        ${sig > 0 ? brokenCircle(230, 230, 46, "#24222e", 9, sig) : ""}
      </g>`;
    s += `<rect width="${W}" height="${H}" fill="#000" opacity="${out}"/>`;
    return camera(s, 1 + 0.05 * u / d);
  },
  S14(u, d, t) { // end card: echo rings, title, AI disclosure
    let s = `<rect width="${W}" height="${H}" fill="#000"/>`;
    for (let k = 0; k < 4; k++) {
      const st = 0.95 + k * 0.38, e = u - st;
      if (e > 0) s += `<circle cx="540" cy="860" r="${60 + e * 520}" fill="none" stroke="#f2c86b" stroke-width="${5 - k}" opacity="${Math.max(0, 0.8 - e * 0.55) * (1 - k * 0.2)}"/>`;
    }
    const tIn = seq(u, 0.9, 1.6);
    s += `<g opacity="${tIn}"><text x="540" y="880" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="88" letter-spacing="6" fill="#f2c86b">DAS ECHO-ARCHIV</text>
      <text x="540" y="960" text-anchor="middle" font-family="Inter" font-weight="600" font-size="38" letter-spacing="8" fill="#d8cfb8">FOLGE 1 · REGEL ACHT</text>
      <text x="540" y="1420" text-anchor="middle" font-family="Inter" font-size="34" fill="#9a9eab">KI-generierte fiktionale Serie</text></g>`;
    return s;
  },
};

window.initScene = (tl) => {
  TL = tl;
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const x = c.getContext("2d"), img = x.createImageData(256, 256), r = rng(99);
  for (let i = 0; i < img.data.length; i += 4) { const v = 110 + r() * 145; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  x.putImageData(img, 0, 0); GRAIN = c.toDataURL();
};

window.renderAt = (t) => {
  resetUid();
  const shot = TL.shots.find((s) => t >= s.start && t < s.end) || TL.shots[TL.shots.length - 1];
  const u = t - shot.start, d = shot.end - shot.start;
  const r = rng(Math.floor(t * 30) + 5);
  const grain = `<defs><pattern id="grainP" width="256" height="256" patternUnits="userSpaceOnUse" x="${Math.floor(r() * 256)}" y="${Math.floor(r() * 256)}">
    <image href="${GRAIN}" width="256" height="256"/></pattern></defs>`;
  document.getElementById("stage").innerHTML = grain + SHOTS[shot.id](u, d, t) + vignette(0.55)
    + `<rect width="${W}" height="${H}" fill="url(#grainP)" opacity="${shot.id === "S09" ? 0.16 : 0.09}" style="mix-blend-mode:overlay"/>`;
  const line = TL.lines.find((l) => t >= l.start - 0.05 && t <= l.end + 0.35);
  const cap = document.getElementById("cap");
  cap.textContent = line ? line.text : "";
  cap.className = line && (OFFSCREEN[line.shot] || []).includes(line.who) ? "off" : "";
  const b = document.getElementById("brand");
  b.textContent = t < 2.6 ? "DAS ECHO-ARCHIV · 01" : "";
  b.style.opacity = t < 2.6 ? Math.min(1, t * 2, (2.6 - t) * 3) * 0.85 : 0;
};
</script></body></html>
